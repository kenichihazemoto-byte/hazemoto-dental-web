<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ハゼモト建設｜歯科見積 活動DB（蓄積ビュー）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1f4e78;--bg:#f4f6f9;--line:#dfe4ea;--good:#2f8f5b;--red:#c00000;--amber:#dd8b1a}
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic","Hiragino Sans",sans-serif;background:var(--bg);color:#222}
header{background:var(--blue);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:18px}header a{color:#cfe0f5;font-size:13px}
.wrap{padding:16px;max-width:1100px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.card .l{font-size:12px;color:#666}.card .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue)}
.card .s{font-size:11px;color:#888}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
h2{font-size:14px;color:var(--blue);margin:2px 0 10px;border-bottom:2px solid var(--blue);padding-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
th{background:#eef2f7}td.l,th.l{text-align:left}
.chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.st-受注{background:#e2efda;color:#375623}.st-失注{background:#ffc7ce;color:#9c0006}.st-概算,.st-提出済{background:#eef0f2;color:#5a6673}.st-商談中{background:#fff2cc;color:#7f6000}.st-保留{background:#e7eef0;color:#14657a}
.ut-歯科新築{color:#1f4e78;font-weight:700}.ut-歯科テナント内装{color:#dd8b1a;font-weight:700}
.bars div{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.bars .bar{height:14px;background:var(--blue);border-radius:3px}
.bars .nm{width:120px}.bars .ct{width:90px;text-align:right;color:#555}
select,button{padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
button{background:var(--blue);color:#fff;border:0;cursor:pointer}
.note{font-size:11px;color:#888;margin-top:6px}
</style></head><body>
<div id="loginOverlay" style="position:fixed;inset:0;background:#1f4e78;display:none;align-items:center;justify-content:center;z-index:1000">
  <div style="background:#fff;border-radius:12px;padding:28px;width:340px;max-width:90%">
    <div style="font-size:18px;font-weight:700;color:#1f4e78;margin-bottom:14px">ハゼモト建設｜活動DB ログイン</div>
    <label style="font-size:12px;color:#555">メールアドレス</label>
    <input type="email" id="loginEmail" autocomplete="username" style="width:100%;padding:9px;margin:2px 0 8px;border:1px solid #dfe4ea;border-radius:6px;font-size:14px">
    <label style="font-size:12px;color:#555">パスワード</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%;padding:9px;margin:2px 0 12px;border:1px solid #dfe4ea;border-radius:6px;font-size:14px">
    <button onclick="doLogin()" style="width:100%;padding:11px;background:#1f4e78;color:#fff;border:0;border-radius:7px;font-size:14px;cursor:pointer">ログイン</button>
    <div id="loginMsg" style="color:#c00000;font-size:12px;margin-top:8px"></div>
  </div>
</div>
<header><h1>📊 歯科見積 活動DB（蓄積ビュー）</h1><div><a href="index.html" style="color:#cfe0f5">← 見積アプリ</a>　<a href="#" onclick="doLogout();return false" style="color:#cfe0f5">ログアウト</a></div></header>
<div class="wrap">
  <div style="margin-bottom:10px"><button onclick="load()">🔄 更新</button>
   <select id="fUse" onchange="renderList()"><option value="">種別：全て</option><option value="歯科新築">木造新築</option><option value="歯科テナント内装">テナント内装</option></select>
   <select id="fStatus" onchange="renderList()"><option value="">状態：全て</option><option value="概算">概算</option><option value="提出済">提出済</option><option value="商談中">商談中</option><option value="受注">受注</option><option value="失注">失注</option><option value="保留">保留</option></select>
   <span id="status" class="note"></span></div>
  <div id="cards" class="cards"></div>
  <div class="panel"><h2>種別別サマリ</h2><div id="byUse" class="bars"></div></div>
  <div class="panel"><h2>ステータス別</h2><div id="byStatus" class="bars"></div></div>
  <div class="panel"><h2>活動一覧</h2><div style="overflow-x:auto"><table id="tbl"><thead><tr><th class="l">案件／顧客</th><th class="l">種別</th><th>精度</th><th class="l">状態</th><th>坪</th><th>税込</th><th>坪単価</th><th class="l">担当</th><th class="l">日付</th></tr></thead><tbody></tbody></table></div>
   <div class="note">※原価・粗利率は保持していません（売価・活動情報のみ）。データはサーバ側で取得（社内限定）。</div>
  </div>
</div>
<script>
const SB_URL="https://rrfeqnzxhbxntyewgeyj.supabase.co";
const PUB_KEY="sb_publishable_GE3cACbThh42Ln5fBSmH-Q_VMfKD0UD";
const APP_TOKEN="hzmt-dental-8f3a2c";
let DATA={summary:null,list:[]};
const sbAuth=window.supabase.createClient(SB_URL,PUB_KEY);
let AUTHTOKEN=PUB_KEY;
async function initAuth(){var s=(await sbAuth.auth.getSession()).data.session;
  if(s){AUTHTOKEN=s.access_token;document.getElementById('loginOverlay').style.display='none';load();}
  else{document.getElementById('loginOverlay').style.display='flex';}}
async function doLogin(){var msg=document.getElementById('loginMsg');msg.textContent='認証中…';msg.style.color='#555';
  var em=document.getElementById('loginEmail').value.trim(),pw=document.getElementById('loginPass').value;
  var {data,error}=await sbAuth.auth.signInWithPassword({email:em,password:pw});
  if(error){msg.style.color='#c00000';msg.textContent='ログイン失敗：'+error.message;return;}
  AUTHTOKEN=data.session.access_token;document.getElementById('loginOverlay').style.display='none';load();}
async function doLogout(){await sbAuth.auth.signOut();location.reload();}
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const man=n=>(n/10000).toFixed(0)+'万';
async function load(){var st=document.getElementById('status');st.textContent='読込中…';
  try{var r=await fetch(SB_URL+'/functions/v1/activities',{method:'POST',headers:{'apikey':PUB_KEY,'Authorization':'Bearer '+AUTHTOKEN,'x-app-token':APP_TOKEN,'Content-Type':'application/json'},body:'{}'});
    var d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    DATA=d;renderCards();renderBars();renderList();st.textContent='';
  }catch(e){st.textContent='⚠ '+e.message;}}
function renderCards(){var s=DATA.summary;var won=(s.by_status.find(x=>x.key==='受注')||{}).count||0;var lost=(s.by_status.find(x=>x.key==='失注')||{}).count||0;
  var rate=(won+lost)>0?Math.round(won/(won+lost)*100):0;
  var c=[['総件数',s.total_count,''],['総額(税込)',yen(s.total_value_incl),''],['受注',won+'件','失注 '+lost+'件'],['受注率',rate+'%','受注/(受注+失注)']];
  document.getElementById('cards').innerHTML=c.map(x=>'<div class="card"><div class="l">'+x[0]+'</div><div class="v">'+x[1]+'</div><div class="s">'+x[2]+'</div></div>').join('');}
function renderBars(){var s=DATA.summary;
  var mx=Math.max(1,...s.by_use_type.map(x=>x.count));
  document.getElementById('byUse').innerHTML=s.by_use_type.map(x=>'<div><span class="nm ut-'+x.key+'">'+lbl(x.key)+'</span><div class="bar" style="width:'+(x.count/mx*180)+'px"></div><span class="ct">'+x.count+'件／'+yen(x.sum_incl)+(x.avg_tsubo_man?'／平均'+x.avg_tsubo_man+'万坪':'')+'</span></div>').join('')||'（データなし）';
  var mx2=Math.max(1,...s.by_status.map(x=>x.count));
  document.getElementById('byStatus').innerHTML=s.by_status.map(x=>'<div><span class="nm"><span class="chip st-'+x.key+'">'+x.key+'</span></span><div class="bar" style="width:'+(x.count/mx2*180)+'px;background:#6b7a90"></div><span class="ct">'+x.count+'件／'+yen(x.sum_incl)+'</span></div>').join('')||'（データなし）';}
function lbl(u){return u==='歯科新築'?'木造新築':u==='歯科テナント内装'?'テナント内装':u;}
function renderList(){var fu=document.getElementById('fUse').value,fs=document.getElementById('fStatus').value;
  var rows=DATA.list.filter(r=>(!fu||r.use_type===fu)&&(!fs||r.status===fs));
  document.querySelector('#tbl tbody').innerHTML=rows.map(function(r){
    return '<tr><td class="l">'+(r.customer_name||'')+'</td><td class="l ut-'+r.use_type+'">'+lbl(r.use_type)+'</td>'
      +'<td>'+(r.accuracy||'')+'</td><td class="l"><span class="chip st-'+r.status+'">'+(r.status||'')+'</span></td>'
      +'<td>'+(r.area_tsubo||'')+'</td><td>'+yen(r.total_amount_incl)+'</td><td>'+(r.unit_price_tsubo_man?r.unit_price_tsubo_man+'万':'')+'</td>'
      +'<td class="l">'+(r.assigned_staff||'')+'</td><td class="l">'+(r.created_at||'').slice(0,10)+'</td></tr>';
  }).join('')||'<tr><td colspan="9" class="l" style="color:#888">該当データなし（見積アプリで保存すると貯まります）</td></tr>';}
initAuth();
</script></body></html>
