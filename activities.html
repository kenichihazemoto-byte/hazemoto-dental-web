<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ハゼモト建設｜歯科見積 活動DB（蓄積ビュー）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1f4e78;--bg:#f4f6f9;--line:#dfe4ea;--good:#2f8f5b;--red:#c00000;--amber:#dd8b1a}
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic","Hiragino Sans",sans-serif;background:var(--bg);color:#222}
header{background:var(--blue);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:18px}header a{color:#cfe0f5;font-size:13px}
.wrap{padding:16px;max-width:1100px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.card .l{font-size:12px;color:#666}.card .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue)}
.card .s{font-size:11px;color:#888}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
h2{font-size:14px;color:var(--blue);margin:2px 0 10px;border-bottom:2px solid var(--blue);padding-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
th{background:#eef2f7}td.l,th.l{text-align:left}
.chip{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.st-受注{background:#e2efda;color:#375623}.st-失注{background:#ffc7ce;color:#9c0006}.st-概算,.st-提出済{background:#eef0f2;color:#5a6673}.st-商談中{background:#fff2cc;color:#7f6000}.st-保留{background:#e7eef0;color:#14657a}
.ut-歯科新築{color:#1f4e78;font-weight:700}.ut-歯科テナント内装{color:#dd8b1a;font-weight:700}
.bars div{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.bars .bar{height:14px;background:var(--blue);border-radius:3px}
.bars .nm{width:120px}.bars .ct{width:90px;text-align:right;color:#555}
select,button{padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
button{background:var(--blue);color:#fff;border:0;cursor:pointer}
.note{font-size:11px;color:#888;margin-top:6px}
</style></head><body>
<div id="loginOverlay" style="position:fixed;inset:0;background:#1f4e78;display:none;align-items:center;justify-content:center;z-index:1000">
  <div style="background:#fff;border-radius:12px;padding:28px;width:340px;max-width:90%">
    <div style="font-size:18px;font-weight:700;color:#1f4e78;margin-bottom:14px">ハゼモト建設｜活動DB ログイン</div>
    <label style="font-size:12px;color:#555">メールアドレス</label>
    <input type="email" id="loginEmail" autocomplete="username" style="width:100%;padding:9px;margin:2px 0 8px;border:1px solid #dfe4ea;border-radius:6px;font-size:14px">
    <label style="font-size:12px;color:#555">パスワード</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%;padding:9px;margin:2px 0 12px;border:1px solid #dfe4ea;border-radius:6px;font-size:14px">
    <button onclick="doLogin()" style="width:100%;padding:11px;background:#1f4e78;color:#fff;border:0;border-radius:7px;font-size:14px;cursor:pointer">ログイン</button>
    <div id="loginMsg" style="color:#c00000;font-size:12px;margin-top:8px"></div>
  </div>
</div>
<header><h1>📊 歯科見積 活動DB（蓄積ビュー）</h1><div><a href="index.html" style="color:#cfe0f5">← 見積アプリ</a>　<a href="#" onclick="doLogout();return false" style="color:#cfe0f5">ログアウト</a></div></header>
<div class="wrap">
  <div style="margin-bottom:10px"><button onclick="load()">🔄 更新</button>
   <select id="fUse" onchange="renderList()"><option value="">種別：全て</option><option value="歯科新築">木造新築</option><option value="歯科テナント内装">テナント内装</option></select>
   <select id="fStatus" onchange="renderList()"><option value="">状態：全て</option><option value="概算">概算</option><option value="提出済">提出済</option><option value="商談中">商談中</option><option value="受注">受注</option><option value="失注">失注</option><option value="保留">保留</option></select>
   <span id="status" class="note"></span></div>
  <div id="cards" class="cards"></div>
  <div class="panel"><h2>種別別サマリ</h2><div id="byUse" class="bars"></div></div>
  <div class="panel"><h2>ステータス別</h2><div id="byStatus" class="bars"></div></div>
  <div class="panel"><h2>活動一覧</h2><div style="overflow-x:auto"><table id="tbl"><thead><tr><th class="l">見積No</th><th class="l">案件／顧客</th><th class="l">種別</th><th>精度</th><th class="l">状態</th><th>坪</th><th>税込</th><th>坪単価</th><th class="l">担当</th><th class="l">日付</th><th class="l">操作</th></tr></thead><tbody></tbody></table></div>
   <div class="note">※原価・粗利率は保持していません（売価・活動情報のみ）。データはサーバ側で取得（社内限定）。</div>
  </div>
</div>
<div id="editOv" style="display:none;position:fixed;inset:0;background:rgba(20,40,60,.55);align-items:flex-start;justify-content:center;z-index:1000;overflow:auto;padding:24px">
  <div style="background:#fff;border-radius:12px;max-width:900px;width:100%;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1f4e78;padding-bottom:8px;margin-bottom:12px">
      <div style="font-size:17px;font-weight:700;color:#1f4e78">✏️ 活動の編集 ― <span id="edTitle"></span></div>
      <button onclick="closeEdit()" style="background:#6b7a90;padding:5px 12px">閉じる</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div><label style="font-size:11px;color:#555">案件名／顧客</label><input id="ed_customer" style="width:100%;padding:6px;border:1px solid #dfe4ea;border-radius:6px"></div>
      <div><label style="font-size:11px;color:#555">担当者</label><input id="ed_staff" style="width:100%;padding:6px;border:1px solid #dfe4ea;border-radius:6px"></div>
      <div><label style="font-size:11px;color:#555">ステータス</label><select id="ed_status" style="width:100%;padding:6px;border:1px solid #dfe4ea;border-radius:6px"><option>概算</option><option>提出済</option><option>商談中</option><option>受注</option><option>失注</option><option>保留</option></select></div>
      <div><label style="font-size:11px;color:#555">精度</label><select id="ed_acc" style="width:100%;padding:6px;border:1px solid #dfe4ea;border-radius:6px"><option>A</option><option>B</option><option>C</option></select></div>
      <div style="grid-column:span 2"><label style="font-size:11px;color:#555">前提条件</label><input id="ed_assume" style="width:100%;padding:6px;border:1px solid #dfe4ea;border-radius:6px"></div>
      <div style="grid-column:span 3"><label style="font-size:11px;color:#555">未確認事項</label><input id="ed_unconf" style="width:100%;padding:6px;border:1px solid #dfe4ea;border-radius:6px"></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px">
      <h2 style="margin:0">明細（追加・削除・数量/単価 修正）</h2>
      <button onclick="edAdd()" style="padding:5px 12px;background:#2f8f5b">＋ 行を追加</button>
    </div>
    <div id="edLines" style="overflow-x:auto;max-height:46vh;overflow-y:auto;border:1px solid #eef0f2;border-radius:6px"></div>
    <div id="edTotal" style="margin-top:10px;font-size:14px;background:#eef4fb;border-radius:6px;padding:8px 12px"></div>
    <div style="margin-top:10px;font-size:12px;background:#f4f6f9;border-radius:6px;padding:7px 9px;line-height:2">
      🖨 印刷設定：<label>工事名 <input id="ed_proj" placeholder="（空欄=自動）" style="width:200px;padding:2px 5px;border:1px solid #dfe4ea;border-radius:4px"></label>
      <label>有効期間 <select id="ed_exp" style="padding:2px 4px"><option value="14">2週間</option><option value="30" selected>30日</option><option value="60">60日</option><option value="90">90日</option></select></label>
      <label>向き <select id="ed_orient" style="padding:2px 4px"><option value="landscape">横</option><option value="portrait" selected>縦</option></select></label></div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button onclick="saveEdit()" style="padding:10px 18px;font-size:14px">☁ 保存する</button>
      <button onclick="printEditor('detail')" style="padding:10px 16px;font-size:14px;background:#2f8f5b">🖨 提出(小明細)</button>
      <button onclick="printEditor('cover')" style="padding:10px 16px;font-size:14px;background:#2f8f5b">🖨 提出(表紙)</button>
      <button onclick="closeEdit()" style="padding:10px 16px;background:#6b7a90">閉じる</button>
      <span id="edMsg" class="note"></span>
    </div>
  </div>
</div>
<script>
const SB_URL="https://rrfeqnzxhbxntyewgeyj.supabase.co";
const PUB_KEY="sb_publishable_GE3cACbThh42Ln5fBSmH-Q_VMfKD0UD";
const APP_TOKEN="hzmt-dental-8f3a2c";
let DATA={summary:null,list:[]};
const sbAuth=window.supabase.createClient(SB_URL,PUB_KEY);
let AUTHTOKEN=PUB_KEY;
async function initAuth(){var s=(await sbAuth.auth.getSession()).data.session;
  if(s){AUTHTOKEN=s.access_token;document.getElementById('loginOverlay').style.display='none';load();}
  else{document.getElementById('loginOverlay').style.display='flex';}}
async function doLogin(){var msg=document.getElementById('loginMsg');msg.textContent='認証中…';msg.style.color='#555';
  var em=document.getElementById('loginEmail').value.trim(),pw=document.getElementById('loginPass').value;
  var {data,error}=await sbAuth.auth.signInWithPassword({email:em,password:pw});
  if(error){msg.style.color='#c00000';msg.textContent='ログイン失敗：'+error.message;return;}
  AUTHTOKEN=data.session.access_token;document.getElementById('loginOverlay').style.display='none';load();}
async function doLogout(){await sbAuth.auth.signOut();location.reload();}
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const man=n=>(n/10000).toFixed(0)+'万';
async function load(){var st=document.getElementById('status');st.textContent='読込中…';
  try{var r=await fetch(SB_URL+'/functions/v1/activities',{method:'POST',headers:{'apikey':PUB_KEY,'Authorization':'Bearer '+AUTHTOKEN,'x-app-token':APP_TOKEN,'Content-Type':'application/json'},body:'{}'});
    var d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    DATA=d;renderCards();renderBars();renderList();st.textContent='';
  }catch(e){st.textContent='⚠ '+e.message;}}
function renderCards(){var s=DATA.summary;var won=(s.by_status.find(x=>x.key==='受注')||{}).count||0;var lost=(s.by_status.find(x=>x.key==='失注')||{}).count||0;
  var rate=(won+lost)>0?Math.round(won/(won+lost)*100):0;
  var c=[['総件数',s.total_count,''],['総額(税込)',yen(s.total_value_incl),''],['受注',won+'件','失注 '+lost+'件'],['受注率',rate+'%','受注/(受注+失注)']];
  document.getElementById('cards').innerHTML=c.map(x=>'<div class="card"><div class="l">'+x[0]+'</div><div class="v">'+x[1]+'</div><div class="s">'+x[2]+'</div></div>').join('');}
function renderBars(){var s=DATA.summary;
  var mx=Math.max(1,...s.by_use_type.map(x=>x.count));
  document.getElementById('byUse').innerHTML=s.by_use_type.map(x=>'<div><span class="nm ut-'+x.key+'">'+lbl(x.key)+'</span><div class="bar" style="width:'+(x.count/mx*180)+'px"></div><span class="ct">'+x.count+'件／'+yen(x.sum_incl)+(x.avg_tsubo_man?'／平均'+x.avg_tsubo_man+'万坪':'')+'</span></div>').join('')||'（データなし）';
  var mx2=Math.max(1,...s.by_status.map(x=>x.count));
  document.getElementById('byStatus').innerHTML=s.by_status.map(x=>'<div><span class="nm"><span class="chip st-'+x.key+'">'+x.key+'</span></span><div class="bar" style="width:'+(x.count/mx2*180)+'px;background:#6b7a90"></div><span class="ct">'+x.count+'件／'+yen(x.sum_incl)+'</span></div>').join('')||'（データなし）';}
function lbl(u){return u==='歯科新築'?'木造新築':u==='歯科テナント内装'?'テナント内装':u;}
function renderList(){var fu=document.getElementById('fUse').value,fs=document.getElementById('fStatus').value;
  var rows=DATA.list.filter(r=>(!fu||r.use_type===fu)&&(!fs||r.status===fs));
  document.querySelector('#tbl tbody').innerHTML=rows.map(function(r){
    return '<tr><td class="l" style="font-size:11px;white-space:nowrap">'+(r.quote_no||'')+((r.revision&&r.revision>1)?' <span style="color:#c0392b">改'+r.revision+'</span>':'')+'</td><td class="l">'+(r.customer_name||'')+'</td><td class="l ut-'+r.use_type+'">'+lbl(r.use_type)+'</td>'
      +'<td>'+(r.accuracy||'')+'</td><td class="l"><span class="chip st-'+r.status+'">'+(r.status||'')+'</span></td>'
      +'<td>'+(r.area_tsubo||'')+'</td><td>'+yen(r.total_amount_incl)+'</td><td>'+(r.unit_price_tsubo_man?r.unit_price_tsubo_man+'万':'')+'</td>'
      +'<td class="l">'+(r.assigned_staff||'')+'</td><td class="l">'+(r.created_at||'').slice(0,10)+'</td>'
      +'<td class="l" style="white-space:nowrap"><button onclick="location.href=\'index.html?load='+r.id+'\'" style="padding:3px 8px;font-size:11px;background:#2f8f5b">📥開く</button> <button onclick="editRow(\''+r.id+'\')" style="padding:3px 8px;font-size:11px">✏️編集</button> <button onclick="delRow(\''+r.id+'\',\''+(r.customer_name||'').replace(/\x27/g,"")+'\')" style="padding:3px 8px;font-size:11px;background:#c0392b">🗑</button></td></tr>';
  }).join('')||'<tr><td colspan="11" class="l" style="color:#888">該当データなし（見積アプリで保存すると貯まります）</td></tr>';}

// ===== 削除 =====
async function delRow(id,name){if(!confirm('この活動を削除しますか？\n「'+name+'」\n※元に戻せません'))return;
  try{var r=await fetch(SB_URL+'/functions/v1/activities',{method:'POST',headers:api(),body:JSON.stringify({action:'delete',id:id})});
    var d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));load();
  }catch(e){alert('削除失敗: '+e.message);}}
function api(){return {'apikey':PUB_KEY,'Authorization':'Bearer '+AUTHTOKEN,'x-app-token':APP_TOKEN,'Content-Type':'application/json'};}

// ===== 編集（サマリ＋明細の追加/削除/単価数量修正）=====
var ED={id:null,lines:[],meta:{},row:null};
async function editRow(id){var ov=document.getElementById('editOv');document.getElementById('edMsg').textContent='読込中…';ov.style.display='flex';
  try{var r=await fetch(SB_URL+'/functions/v1/activities',{method:'POST',headers:api(),body:JSON.stringify({action:'get',id:id})});
    var d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    var row=d.row;ED={id:id,lines:(row.lines||[]).map(function(l){return Object.assign({},l);}),meta:row.meta||{},row:row};
    document.getElementById('edTitle').textContent=(row.customer_name||'')+'（'+lbl(row.use_type)+'）';
    document.getElementById('ed_customer').value=row.customer_name||'';
    document.getElementById('ed_staff').value=row.assigned_staff||'';
    document.getElementById('ed_status').value=row.status||'概算';
    document.getElementById('ed_acc').value=row.accuracy||'B';
    document.getElementById('ed_assume').value=row.assumptions||'';
    document.getElementById('ed_unconf').value=row.unconfirmed||'';
    renderEdLines();document.getElementById('edMsg').textContent=ED.lines.length?'':'※この案件は明細スナップショットなし（サマリのみ編集可）。見積アプリで作り直すと明細付きで保存されます。';
  }catch(e){document.getElementById('edMsg').textContent='⚠ '+e.message;}}
function closeEdit(){document.getElementById('editOv').style.display='none';}
function renderEdLines(){var groups={};ED.lines.forEach(function(l,i){(groups[l.cattitle||l.cat||'その他']=groups[l.cattitle||l.cat||'その他']||[]).push(i);});
  var h='<table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th class="l">名称</th><th>数量</th><th>単位</th><th>単価</th><th>金額</th><th></th></tr></thead><tbody>';
  Object.keys(groups).forEach(function(g){
    h+='<tr style="background:#eef2f7;font-weight:700"><td class="l" colspan="6">'+g+'</td></tr>';
    groups[g].forEach(function(i){var l=ED.lines[i];
      h+='<tr><td class="l"><input value="'+(l.name||'').replace(/"/g,"&quot;")+'" style="width:98%;padding:2px" oninput="edSet('+i+',\'name\',this.value)"></td>'
        +'<td><input type="number" value="'+(l.qty||0)+'" style="width:60px;text-align:right;padding:2px" oninput="edSet('+i+',\'qty\',this.value)"></td>'
        +'<td><input value="'+(l.unit||'')+'" style="width:40px;padding:2px"  oninput="edSet('+i+',\'unit\',this.value)"></td>'
        +'<td><input type="number" value="'+(l.price||0)+'" style="width:88px;text-align:right;padding:2px" oninput="edSet('+i+',\'price\',this.value)"></td>'
        +'<td id="edAmt'+i+'" style="text-align:right">'+yen(l.amount)+'</td>'
        +'<td><button onclick="edDel('+i+')" style="padding:2px 6px;background:#c0392b;font-size:11px">削除</button></td></tr>';});});
  h+='</tbody></table>';document.getElementById('edLines').innerHTML=h;edRecalc();}
function edSet(i,f,v){var l=ED.lines[i];l[f]=(f==='name'||f==='unit')?v:(parseFloat(v)||0);l.amount=Math.round((l.qty||0)*(l.price||0));
  var el=document.getElementById('edAmt'+i);if(el)el.textContent=yen(l.amount);edRecalc();}
function edDel(i){ED.lines.splice(i,1);renderEdLines();}
function edAdd(){ED.lines.push({cat:'',cattitle:'追加項目',name:'',unit:'式',qty:1,price:0,amount:0,genkyo:'手動追加'});renderEdLines();}
function edRecalc(){var m=ED.meta||{};var direct=0;ED.lines.forEach(function(l){direct+=(l.amount||0);});
  var genba=Math.round(direct*(m.genbaR||0)),ippan=Math.round(direct*(m.ippanR||0));
  var work=direct+genba+ippan+(m.sekkei||0)+(m.opt||0);var incl=Math.round(work*1.1);
  var tsubo=m.tsubo||ED.row&&ED.row.area_tsubo||0;var tman=tsubo?Math.round(work/tsubo/100)/100:null;
  ED._work=work;ED._incl=incl;ED._tman=tman;
  document.getElementById('edTotal').innerHTML='直接工事 '+yen(direct)+'　→　工事価格(税抜) <b>'+yen(work)+'</b>　税込 <b style="color:#1f4e78">'+yen(incl)+'</b>'+(tman?'　坪 '+tman+'万':'');}
async function saveEdit(){var msg=document.getElementById('edMsg');msg.style.color='#555';msg.textContent='保存中…';
  var fields={customer_name:document.getElementById('ed_customer').value.trim(),
    assigned_staff:document.getElementById('ed_staff').value.trim()||null,
    status:document.getElementById('ed_status').value,accuracy:document.getElementById('ed_acc').value,
    assumptions:document.getElementById('ed_assume').value.trim()||null,
    unconfirmed:document.getElementById('ed_unconf').value.trim()||null};
  if(ED.lines.length){fields.lines=ED.lines;fields.total_amount_excl=ED._work;fields.total_amount_incl=ED._incl;fields.unit_price_tsubo_man=ED._tman;}
  try{var r=await fetch(SB_URL+'/functions/v1/activities',{method:'POST',headers:api(),body:JSON.stringify({action:'update',id:ED.id,fields:fields})});
    var d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    closeEdit();load();
  }catch(e){msg.style.color='#c00000';msg.textContent='⚠ 保存失敗: '+e.message;}}
function printEditor(mode){
  if(!ED.lines||!ED.lines.length){alert('この案件は明細スナップショットがありません。\n見積アプリ（📥開く）で作り直して保存すると、明細付きで印刷できます。');return;}
  var m=ED.meta||{};
  var lines=ED.lines.map(function(l){var a=l.amount||Math.round((l.qty||0)*(l.price||0));return {cat:l.cat||'',cattitle:l.cattitle||l.cat||'その他',name:l.name||'',unit:l.unit||'',qty:l.qty||0,price:l.price||0,amount:a};}).filter(function(l){return l.amount>0;});
  var direct=lines.reduce(function(a,l){return a+l.amount;},0);
  var genba=Math.round(direct*(m.genbaR||0)),ippan=Math.round(direct*(m.ippanR||0));
  var work=direct+genba+ippan+(m.sekkei||0)+(m.opt||0);var incl=Math.round(work*1.1);
