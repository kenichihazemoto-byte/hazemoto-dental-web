<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ハゼモト建設｜歯科見積 マスタ単価管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#1f4e78;--bg:#f4f6f9;--line:#dfe4ea}
*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic","Hiragino Sans",sans-serif;background:var(--bg);color:#222}
header{background:var(--blue);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:18px}header a{color:#cfe0f5;font-size:13px}
.wrap{padding:16px;max-width:1000px;margin:0 auto}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
select,button,input{padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
button{background:var(--blue);color:#fff;border:0;cursor:pointer}
button.save{background:#2f8f5b;font-size:14px;padding:9px 18px}
.note{font-size:11px;color:#888}
.catbox{background:#fff;border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}
.cathead{background:#eef2f7;color:var(--blue);font-weight:700;padding:8px 12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{border-bottom:1px solid #eef0f2;padding:5px 8px;text-align:left}
th{background:#fafbfc;color:#666;font-weight:600}
td.r,th.r{text-align:right}
input.price{width:110px;text-align:right;padding:3px 6px;font-variant-numeric:tabular-nums}
input.price.dirty{border-color:#dd8b1a;background:#fff8e8}
.warn{background:#fff2cc;border:1px solid #dd8b1a;color:#7f6000;font-size:12px;padding:8px 10px;border-radius:6px;margin:8px 0}
.ro{background:#f0f2f5}
</style></head><body>
<div id="loginOverlay" style="position:fixed;inset:0;background:#1f4e78;display:none;align-items:center;justify-content:center;z-index:1000">
  <div style="background:#fff;border-radius:12px;padding:28px;width:340px;max-width:90%">
    <div style="font-size:18px;font-weight:700;color:#1f4e78;margin-bottom:14px">ハゼモト建設｜単価管理 ログイン</div>
    <label style="font-size:12px;color:#555">メールアドレス</label>
    <input type="email" id="loginEmail" autocomplete="username" style="width:100%;padding:9px;margin:2px 0 8px">
    <label style="font-size:12px;color:#555">パスワード</label>
    <input type="password" id="loginPass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%;padding:9px;margin:2px 0 12px">
    <button onclick="doLogin()" style="width:100%;padding:11px">ログイン</button>
    <div id="loginMsg" style="color:#c00000;font-size:12px;margin-top:8px"></div>
  </div>
</div>
<header><h1>🛠 マスタ単価管理</h1><div><a href="index.html">← 見積アプリ</a>　<a href="activities.html">活動DB</a>　<a href="#" onclick="doLogout();return false">ログアウト</a></div></header>
<div class="wrap">
  <div id="adminNote"></div>
  <div class="bar">
    <select id="fUse" onchange="render()"><option value="歯科テナント内装">テナント内装</option><option value="歯科新築">木造新築</option></select>
    <input id="fSearch" placeholder="名称で絞り込み" oninput="render()" style="width:180px">
    <span style="flex:1"></span>
    <span id="dirtyCount" class="note"></span>
    <button class="save" id="saveBtn" onclick="saveAll()" disabled>💾 変更を保存</button>
    <span id="status" class="note"></span>
  </div>
  <div class="note" style="margin:6px 0">※単価（税抜・売価）を直接改定できます。変更した欄は黄色く表示され、「保存」で全マスタに即反映（全見積に反映）。原価は売価×(1−工種粗利率)で自動算出されます。</div>
  <div id="list"></div>
  <div id="surbox"></div>
</div>
<script>
const SB_URL="https://rrfeqnzxhbxntyewgeyj.supabase.co";
const PUB_KEY="sb_publishable_GE3cACbThh42Ln5fBSmH-Q_VMfKD0UD";
const APP_TOKEN="hzmt-dental-8f3a2c";
const sbAuth=window.supabase.createClient(SB_URL,PUB_KEY);
let AUTHTOKEN=PUB_KEY;
var DATA={items:[],cats:[],options:[],surcharges:[],isAdmin:false};
var DIRTY={}, DIRTY_SUR={};
const yen=n=>Number(n||0).toLocaleString('ja-JP');
function api(){return {'apikey':PUB_KEY,'Authorization':'Bearer '+AUTHTOKEN,'x-app-token':APP_TOKEN,'Content-Type':'application/json'};}
async function initAuth(){var s=(await sbAuth.auth.getSession()).data.session;
  if(s){AUTHTOKEN=s.access_token;document.getElementById('loginOverlay').style.display='none';load();}
  else{document.getElementById('loginOverlay').style.display='flex';}}
async function doLogin(){var m=document.getElementById('loginMsg');m.textContent='認証中…';
  var em=document.getElementById('loginEmail').value.trim(),pw=document.getElementById('loginPass').value;
  var {data,error}=await sbAuth.auth.signInWithPassword({email:em,password:pw});
  if(error){m.textContent='ログイン失敗：'+error.message;return;}
  AUTHTOKEN=data.session.access_token;document.getElementById('loginOverlay').style.display='none';load();}
async function doLogout(){await sbAuth.auth.signOut();location.reload();}
async function load(){var st=document.getElementById('status');st.textContent='読込中…';DIRTY={};DIRTY_SUR={};
  try{var r=await fetch(SB_URL+'/functions/v1/master',{method:'POST',headers:api(),body:JSON.stringify({action:'list'})});
    var d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    DATA=d;st.textContent='';
    document.getElementById('adminNote').innerHTML=d.isAdmin?'<div class="warn">✅ 管理者モード（櫨本代表）：単価を改定して保存できます。</div>':'<div class="warn">👀 閲覧のみ：単価の改定・保存は<b>管理者（櫨本代表 ken@hazemoto-k.co.jp）</b>のログイン時のみ可能です。</div>';
    render();renderSur();updateDirty();
  }catch(e){st.textContent='⚠ '+e.message;}}
function render(){var use=document.getElementById('fUse').value;var q=(document.getElementById('fSearch').value||'').trim();
  var cats=DATA.cats.filter(function(c){return c.use_type===use;});
  var box=document.getElementById('list');var h='';
  cats.forEach(function(c){
    var its=DATA.items.filter(function(i){return i.use_type===use&&i.cat===c.cat&&(!q||(i.name||'').indexOf(q)>=0);});
    if(!its.length)return;
    h+='<div class="catbox"><div class="cathead">'+c.cat+'　'+c.title+'</div><table><thead><tr><th>名称</th><th>単位</th><th class="r">単価(税抜)</th><th>数量根拠</th></tr></thead><tbody>';
    its.forEach(function(i){var v=(DIRTY[i.id]!=null)?DIRTY[i.id]:i.sell_unit_price;
      h+='<tr><td>'+i.name+(i.spec?'<br><span style="color:#aaa;font-size:10px">'+i.spec+'</span>':'')+'</td><td>'+(i.unit||'')+'</td>'
        +'<td class="r"><input class="price'+(DIRTY[i.id]!=null?' dirty':'')+'" type="number" value="'+v+'" data-id="'+i.id+'" '+(DATA.isAdmin?'':'disabled')+' oninput="onPrice(this)"></td>'
        +'<td style="color:#888;font-size:11px">'+(i.genkyo||'')+'</td></tr>';});
    h+='</tbody></table></div>';
  });
  // オプション
  var ops=DATA.options.filter(function(o){return o.use_type===use&&(!q||(o.name||'').indexOf(q)>=0);});
  if(ops.length){h+='<div class="catbox"><div class="cathead">高級仕様オプション</div><table><thead><tr><th>名称</th><th>単位</th><th class="r">単価(税抜)</th><th>数量根拠</th></tr></thead><tbody>';
    ops.forEach(function(o){var v=(DIRTY['op_'+o.id]!=null)?DIRTY['op_'+o.id]:o.sell_unit_price;
      h+='<tr><td>'+o.name+'</td><td>'+(o.unit||'')+'</td><td class="r"><input class="price'+(DIRTY['op_'+o.id]!=null?' dirty':'')+'" type="number" value="'+v+'" data-op="'+o.id+'" '+(DATA.isAdmin?'':'disabled')+' oninput="onPrice(this)"></td><td style="color:#888;font-size:11px">'+(o.genkyo||'')+'</td></tr>';});
    h+='</tbody></table></div>';}
  box.innerHTML=h||'<div class="note">該当なし</div>';
}
function renderSur(){var use=document.getElementById('fUse').value;
  var s=DATA.surcharges.filter(function(x){return x.use_type===use;});
  if(!s.length){document.getElementById('surbox').innerHTML='';return;}
  var h='<div class="catbox"><div class="cathead">資材高騰 改定率（2026年10月・工種別 ％）</div><table><thead><tr><th>工種</th><th class="r">上乗せ％</th><th>備考</th></tr></thead><tbody>';
  s.forEach(function(x){var v=(DIRTY_SUR[x.id]!=null)?DIRTY_SUR[x.id]:x.pct;
    h+='<tr><td>'+x.cat+'</td><td class="r"><input class="price'+(DIRTY_SUR[x.id]!=null?' dirty':'')+'" type="number" step="0.5" value="'+v+'" data-sur="'+x.id+'" '+(DATA.isAdmin?'':'disabled')+' oninput="onSur(this)"></td><td style="color:#888;font-size:11px">'+(x.note||'')+'</td></tr>';});
  h+='</tbody></table></div>';document.getElementById('surbox').innerHTML=h;
}
function onPrice(el){var id=el.getAttribute('data-id'),op=el.getAttribute('data-op');var val=parseFloat(el.value);
  if(op){DIRTY['op_'+op]=val;el.dataset.k='op_'+op;}else{DIRTY[id]=val;}
  el.classList.add('dirty');updateDirty();}
function onSur(el){var id=el.getAttribute('data-sur');DIRTY_SUR[id]=parseFloat(el.value);el.classList.add('dirty');updateDirty();}
function updateDirty(){var n=Object.keys(DIRTY).length+Object.keys(DIRTY_SUR).length;
  document.getElementById('dirtyCount').textContent=n?('未保存 '+n+'件'):'';
  document.getElementById('saveBtn').disabled=(!DATA.isAdmin||n===0);}
async function saveAll(){var st=document.getElementById('status');st.textContent='保存中…';
  var items=[],options=[],surcharges=[];
  Object.keys(DIRTY).forEach(function(k){if(k.indexOf('op_')===0)options.push({id:k.slice(3),sell_unit_price:DIRTY[k]});else items.push({id:k,sell_unit_price:DIRTY[k]});});
  Object.keys(DIRTY_SUR).forEach(function(k){surcharges.push({id:k,pct:DIRTY_SUR[k]});});
  try{var r=await fetch(SB_URL+'/functions/v1/master',{method:'POST',headers:api(),body:JSON.stringify({action:'save',items:items,options:options,surcharges:surcharges})});
    var d=await r.json();if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));
    st.textContent='✅ '+d.updated+'件を保存しました（全見積に反映）';load();
  }catch(e){st.textContent='⚠ 保存失敗: '+e.message;}}
initAuth();
</script></body></html>
